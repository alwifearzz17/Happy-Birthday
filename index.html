<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🎉 Happy Birthday, <span class="different-font">Reena</span>! 🎂</h1>
        <p>Semoga panjang umur dan dimurahkan rezeki selalu Reena!! Idola ceci gaada obat hehe 🍰🥳</p>
        <div class="cake">
            <div class="plate"></div>
            <div class="layer layer-bottom"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-top"></div>
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>
        
        <button onclick="showModal()">Tekan sini</button>

      
        <div class="modal" id="myModal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <p>May you have the best year ahead! Byeee 🎁</p>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.body.classList.add('modal-open'); // Add class to prevent body scrolling
            const modal = document.getElementById("myModal");
            modal.style.display = "flex";
            triggerFireworks();
        }

        function closeModal() {
            document.body.classList.remove('modal-open');
            const modal = document.getElementById("myModal");
            modal.style.display = "none";
        }
            
        window.onclick = function(event) {
            if (event.target === document.getElementById("myModal")) {
                closeModal();
            }
        }
    
        document.querySelector("button").addEventListener("click", openModal);
    
        function triggerFireworks() {
            // Create multiple firework particles
            for (let i = 0; i < 50; i++) {
                let firework = document.createElement('div');
                firework.classList.add('firework');
                document.body.appendChild(firework);
    
                // Position each particle randomly
                let angle = Math.random() * 360;
                let distance = Math.random() * 150 + 50;
                let x = Math.cos(angle) * distance + window.innerWidth / 2;
                let y = Math.sin(angle) * distance + window.innerHeight / 2;
    
                firework.style.left = `${x}px`;
                firework.style.top = `${y}px`;
    
                // Remove the particle after animation ends
                firework.addEventListener('animationend', () => {
                    firework.remove();
                });
            }
        }
    </script>
    
</body>
</html>
